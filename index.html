<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Video Mesh — Oker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --panel-bg: rgba(9,9,11,0.94);
  --panel-border: rgba(255,255,255,0.07);
  --panel-divide: rgba(255,255,255,0.05);
  --ink: #ededec;
  --ink-dim: rgba(237,237,236,0.48);
  --ink-faint: rgba(237,237,236,0.26);
  --hairline: rgba(255,255,255,0.09);
  --accent: #00d4ff;
  --accent-glow: rgba(0,212,255,0.12);
  --hot: #ff5a1f;
  --good: #6ee787;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter Tight', system-ui, Helvetica, Arial, sans-serif;
  --lw: 216px;
  --rw: 272px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{background:#08080a;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
input[type="range"]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:1px;background:var(--hairline)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:12px;background:var(--ink);margin-top:-5.5px;transition:background 100ms}
input[type="range"]:hover::-webkit-slider-thumb{background:var(--accent)}
input[type="range"]::-moz-range-track{height:1px;background:var(--hairline)}
input[type="range"]::-moz-range-thumb{width:8px;height:12px;background:var(--ink);border:none;border-radius:0}

/* LAYOUT */
.vm-layout{display:grid;grid-template-columns:var(--lw) 1fr var(--rw);height:100vh;overflow:hidden}

/* PANELS */
.vm-panel{background:var(--panel-bg);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);display:flex;flex-direction:column;overflow:hidden}
.vm-panel-l{border-right:1px solid var(--panel-border)}
.vm-panel-r{border-left:1px solid var(--panel-border)}
.vm-panel-head{padding:11px 13px 9px;border-bottom:1px solid var(--panel-divide);display:flex;align-items:center;gap:9px;flex-shrink:0}
.vm-mark{width:24px;height:24px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#08080a;flex-shrink:0}
.vm-tool-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase}
.vm-tool-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.vm-head-action{margin-left:auto;color:var(--ink-faint);font-size:14px;padding:3px;transition:color 100ms;line-height:1}
.vm-head-action:hover{color:var(--ink)}
.vm-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.vm-scroll::-webkit-scrollbar{width:3px}
.vm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06)}
.vm-scroll::-webkit-scrollbar-track{background:transparent}

/* META FIELDS */
.vm-meta-field{padding:9px 13px;border-bottom:1px solid var(--panel-divide)}
.vm-meta-lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;display:flex;justify-content:space-between}
.vm-meta-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--hairline);color:var(--ink);padding:6px 8px;font-family:var(--sans);font-size:11.5px;outline:none;transition:border-color 100ms;resize:none}
.vm-meta-input:focus{border-color:rgba(255,255,255,0.28)}
.vm-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px;min-height:18px}
.vm-tag{display:flex;align-items:center;gap:3px;padding:2px 7px;background:var(--accent-glow);border:1px solid rgba(0,212,255,0.25);font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--accent)}
.vm-tag-x{opacity:.55;font-size:11px;line-height:1;transition:opacity 100ms}
.vm-tag-x:hover{opacity:1}
.vm-cover{padding:9px 13px;border-bottom:1px solid var(--panel-divide)}
.vm-cover-thumb{width:100%;aspect-ratio:16/9;background:rgba(255,255,255,0.025);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;margin-bottom:5px;overflow:hidden;position:relative}
.vm-cover-thumb img{width:100%;height:100%;object-fit:cover}
.vm-cover-empty{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);text-align:center}
.vm-cover-btns{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.vm-cover-btn{padding:5px;background:rgba(255,255,255,0.025);border:1px solid var(--hairline);color:var(--ink-faint);font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;transition:all 100ms}
.vm-cover-btn:hover{border-color:rgba(255,255,255,0.18);color:var(--ink-dim)}

/* CENTER */
.vm-center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#08080a}
.vm-preview{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vm-canvas-wrap{position:relative;transform-origin:center center}
.vm-canvas-wrap canvas{display:block}
.vm-corner{position:absolute;width:10px;height:10px;border:1px solid rgba(255,255,255,0.18);pointer-events:none}
.vm-corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
.vm-corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
.vm-corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
.vm-corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none}
.vm-empty-hint{position:absolute;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,0.12);pointer-events:none;text-align:center;line-height:2}

/* SIZE BAR */
.vm-sizebar{flex-shrink:0;height:42px;display:flex;align-items:center;justify-content:center;gap:5px;border-top:1px solid var(--panel-divide);padding:0 12px;background:rgba(8,8,10,.8);position:relative}
.vm-dim-input{width:58px;background:rgba(255,255,255,0.04);border:1px solid var(--hairline);color:var(--ink);padding:5px 7px;font-family:var(--mono);font-size:9.5px;text-align:center;outline:none;transition:border-color 100ms}
.vm-dim-input:focus{border-color:var(--accent)}
.vm-dim-x{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.vm-aspect-btn{background:rgba(255,255,255,0.04);border:1px solid var(--hairline);color:var(--ink-dim);padding:5px 10px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;transition:all 100ms;position:relative}
.vm-aspect-btn:hover{border-color:rgba(255,255,255,0.22);color:var(--ink)}
.vm-aspect-drop{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:rgba(9,9,11,.98);border:1px solid var(--panel-border);min-width:128px;z-index:50;backdrop-filter:blur(20px)}
.vm-aspect-opt{display:block;width:100%;padding:7px 11px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);text-align:left;border:none;background:transparent;border-bottom:1px solid var(--panel-divide);transition:all 100ms;cursor:pointer}
.vm-aspect-opt:last-child{border-bottom:none}
.vm-aspect-opt:hover,.vm-aspect-opt.on{background:var(--accent-glow);color:var(--accent)}

/* RIGHT PANEL CONTROLS */
.vm-acc{border-bottom:1px solid var(--panel-divide)}
.vm-acc-head{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;cursor:pointer;user-select:none;transition:background 100ms}
.vm-acc-head:hover{background:rgba(255,255,255,0.02)}
.vm-acc-title{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:7px}
.vm-acc-n{color:var(--ink-faint)}
.vm-acc-arrow{width:8px;height:8px;border-right:1px solid var(--ink-faint);border-bottom:1px solid var(--ink-faint);transform:rotate(45deg);transition:transform 180ms ease;flex-shrink:0}
.vm-acc-arrow.open{transform:rotate(-135deg)}
.vm-acc-body{padding:9px 13px 11px}

.vm-src-btn{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;background:rgba(255,255,255,0.025);border:1px solid var(--hairline);color:var(--ink-dim);font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:3px;transition:all 100ms;text-align:left}
.vm-src-btn:last-child{margin-bottom:0}
.vm-src-btn:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.18);color:var(--ink)}
.vm-src-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.vm-src-icon{opacity:.5;font-size:11px;width:14px;text-align:center}
.vm-file-row{display:flex;align-items:center;gap:5px;padding:5px 8px;background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.18);margin-bottom:3px}
.vm-file-name{flex:1;font-family:var(--mono);font-size:8.5px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vm-file-clear{color:var(--ink-faint);font-size:13px;line-height:1;padding:2px;transition:color 100ms}
.vm-file-clear:hover{color:var(--hot)}
.vm-url-row{display:flex;gap:3px;margin-bottom:3px}
.vm-url-in{flex:1;background:rgba(255,255,255,0.03);border:1px solid var(--hairline);color:var(--ink);padding:5px 7px;font-family:var(--mono);font-size:9px;outline:none}
.vm-url-in:focus{border-color:var(--accent)}
.vm-url-in::placeholder{color:var(--ink-faint)}
.vm-url-go{padding:5px 9px;background:rgba(255,255,255,0.05);border:1px solid var(--hairline);color:var(--ink-dim);font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;transition:all 100ms}
.vm-url-go:hover{border-color:rgba(255,255,255,0.22);color:var(--ink)}

.vm-sl{margin-bottom:9px}
.vm-sl:last-child{margin-bottom:0}
.vm-sl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px}
.vm-sl-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.vm-sl-val{font-family:var(--mono);font-size:9.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.vm-sl input[type="range"]{width:100%;height:14px;margin:1px 0}

.vm-seg{display:flex;background:rgba(255,255,255,0.03);border:1px solid var(--hairline);padding:2px;gap:2px;margin-top:3px}
.vm-seg-opt{flex:1;padding:4px 3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);text-align:center;transition:all 100ms;border:none;background:transparent;cursor:pointer}
.vm-seg-opt:hover{color:var(--ink-dim)}
.vm-seg-opt.on{background:var(--ink);color:#08080a}

.vm-check{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;cursor:pointer}
.vm-check:last-child{margin-bottom:0}
.vm-check-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.vm-toggle{width:26px;height:13px;background:var(--hairline);border-radius:7px;position:relative;transition:background 150ms;flex-shrink:0}
.vm-toggle::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink-faint);top:2px;left:2px;transition:transform 150ms,background 150ms}
.vm-toggle.on{background:var(--accent)}
.vm-toggle.on::after{transform:translateX(13px);background:#08080a}

.vm-clr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.vm-clr-row:last-child{margin-bottom:0}
.vm-clr-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
input[type="color"]{width:36px;height:22px;border:1px solid var(--hairline);background:transparent;cursor:pointer;padding:1px;-webkit-appearance:none;appearance:none}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
input[type="color"]::-webkit-color-swatch{border:none}

.vm-bg-modes{display:flex;gap:3px;margin-bottom:8px}
.vm-bg-mode{flex:1;padding:5px;background:rgba(255,255,255,0.025);border:1px solid var(--hairline);color:var(--ink-faint);font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;text-align:center;transition:all 100ms;cursor:pointer}
.vm-bg-mode:hover{border-color:rgba(255,255,255,0.18);color:var(--ink-dim)}
.vm-bg-mode.on{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}

.vm-str-in{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--hairline);color:var(--ink);padding:5px 7px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;outline:none;margin-top:3px}
.vm-str-in:focus{border-color:var(--accent)}

.vm-action-bar{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:9px 13px;border-top:1px solid var(--panel-divide);flex-shrink:0}
.vm-action-btn{padding:7px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--hairline);color:var(--ink-dim);font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;text-align:center;transition:all 120ms;cursor:pointer}
.vm-action-btn:hover{border-color:rgba(255,255,255,0.22);color:var(--ink);background:rgba(255,255,255,0.05)}
.vm-action-btn.reset{color:var(--hot);border-color:rgba(255,90,31,0.28)}
.vm-action-btn.reset:hover{background:rgba(255,90,31,0.07);border-color:var(--hot)}

/* STATUS BAR */
.vm-status{padding:7px 13px;border-top:1px solid var(--panel-divide);display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;flex-shrink:0}
.vm-status-live{color:var(--good);display:flex;align-items:center;gap:5px}
.vm-status-dot{width:5px;height:5px;background:var(--good);border-radius:50%;animation:vmblink 1.8s ease infinite}
@keyframes vmblink{0%,100%{opacity:1}50%{opacity:.2}}
.vm-status-fps{color:var(--ink-faint);font-variant-numeric:tabular-nums}

/* EXPORT / RECORDING */
.vm-rec-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.vm-rec-btn{padding:7px 4px;background:rgba(255,255,255,0.03);border:1px solid var(--hairline);color:var(--ink-dim);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-align:center;transition:all 120ms;cursor:pointer}
.vm-rec-btn:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.22);color:var(--ink)}
.vm-rec-active{display:flex;flex-direction:column;gap:7px}
.vm-rec-dot{width:7px;height:7px;border-radius:50%;background:var(--hot);display:inline-block;animation:vmblink .8s ease infinite;flex-shrink:0}
.vm-rec-label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--hot);display:flex;align-items:center;gap:7px}
.vm-rec-bar{height:2px;background:rgba(255,90,31,0.15);width:100%}
.vm-rec-fill{height:100%;background:var(--hot);transition:width 100ms linear}

/* ERROR TOAST */
.vm-err{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:rgba(8,8,10,.97);border:1px solid rgba(255,90,31,.38);color:var(--hot);padding:7px 13px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;z-index:100;max-width:380px;text-align:center;animation:vmfio 3.5s ease forwards;pointer-events:none}
@keyframes vmfio{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="src/video-mesh-viewer.jsx"></script>
<script type="text/babel" src="src/video-mesh-controls.jsx"></script>
<script type="text/babel" src="src/video-mesh-meta.jsx"></script>
<script type="text/babel" src="src/video-mesh-app.jsx"></script>
</body>
</html>
